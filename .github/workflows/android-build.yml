name: Android Build

on:
  push:
    tags: [ "v*" ]  # v로 시작하는 태그만 트리거

# 권한 설정 추가
permissions:
  contents: write  # releases 생성을 위한 권한

jobs:
  build:
    runs-on: ubuntu-latest  # 무료 Ubuntu 러너 사용
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '22.18.0'  # RN 0.86.2 engines.node >= 22.11.0 요구사항 충족
    
    - name: Install dependencies
      run: |
        yarn add false
    
    - name: Make Gradlew Executable
      run: cd android && chmod +x ./gradlew
    
    - name: Create secrets.properties
      run: |
        cat << EOF > android/app/secrets.properties
        STORE_FILE=${{ secrets.ANDROID_KEYSTORE_FILE }}
        STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}
        KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}
        EOF
    
    - name: Decode Keystore
      run: |
        echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
    
    - name: Build Android Release
      run: |
        cd android
        ./gradlew bundleRelease assembleRelease --no-daemon

    - name: Upload AAB
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: android/app/build/outputs/bundle/release/app-release.aab

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: android/app/build/outputs/bundle/release/app-release.aab
        name: Release ${{ github.ref_name }}
        body: |
          Release ${{ github.ref_name }}

          Changes in this release:
          - 자동 생성된 릴리스
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload to Firebase App Distribution
      uses: wzieba/Firebase-Distribution-Github-Action@v1
      with:
        appId: 1:885722038359:android:464defc0b9c3502b5b6312
        serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        groups: 내부테스트
        file: android/app/build/outputs/apk/release/app-release.apk

    # step-level if:에서 secrets context를 직접 비교하는 것은 GitHub Actions 스키마상
    # 허용되지 않는다("Unrecognized named-value: 'secrets'"로 워크플로 자체가 무효 처리됨).
    # run: 스텝에서 값을 먼저 치환해 outputs로 넘기고, 다음 스텝의 if:는 steps 컨텍스트로 검사한다.
    - name: Check Play Store secret
      id: play_secret_check
      run: echo "has_secret=${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON != '' }}" >> "$GITHUB_OUTPUT"

    # PLAY_STORE_SERVICE_ACCOUNT_JSON 시크릿이 등록되기 전까지는 자동으로 스킵된다.
    # Play Console API access에 서비스 계정을 연결하고 시크릿을 추가하면 다음 태그 푸시부터 동작.
    - name: Upload AAB to Google Play Console (internal track)
      if: steps.play_secret_check.outputs.has_secret == 'true'
      uses: r0adkll/upload-google-play@v1
      with:
        serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        packageName: app.mannadev.meditation
        releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
        track: internal
        status: completed